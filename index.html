<!DOCTYPE html>
<html lang="en-IN">
<head>
  <!-- Essentials -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="canonical" href="https://www.joydesignsstudio.com/">

  <!-- Crawling and indexing -->

  <!-- Local SEO -->
  <meta name="author" content="Joy Designs Studio">
  <meta name="geo.region" content="IN-MH">

  <link rel="alternate" hreflang="x-default" href="https://www.joydesignsstudio.com/">

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Slack) -->

  <meta property="og:title" content="Interior Designers in Mumbai | Joy Designs Studio">

  <meta property="og:locale" content="en_IN">

  <meta name="twitter:image" content="https://www.joydesignsstudio.com/images/og-image.jpg">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Structured data: local business -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HomeAndConstructionBusiness",
    "@id": "https://www.joydesignsstudio.com/#business",
    "name": "Joy Designs Studio",
    "description": "Interior design studio in Mumbai specialising in residential and commercial interiors.",
    "url": "https://www.joydesignsstudio.com/",
    "logo": "https://www.joydesignsstudio.com/images/logo.png",
    "image": "https://www.joydesignsstudio.com/images/og-image.jpg",
    "telephone": "+91-XXXXXXXXXX",
    "email": "hello@joydesignsstudio.com",
    "priceRange": "₹₹₹",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "[Street address]",
      "addressLocality": "Mumbai",
      "addressRegion": "Maharashtra",
      "postalCode": "[PIN code]",
      "addressCountry": "IN"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 19.0760,
      "longitude": 72.8777
    },
    "areaServed": [
      { "@type": "City", "name": "Mumbai" },
      { "@type": "City", "name": "South Mumbai" },
      { "@type": "City", "name": "Marine Lines" }
    ],
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],

      "closes": "18:30"
    }
